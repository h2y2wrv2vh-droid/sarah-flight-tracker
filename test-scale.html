<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Sunny's safety scale — test (0 tokens)</title>
<style>
  :root{
    --brand:#e75480; --brand-dark:#c2436c; --brand-deep:#8e2f52;
    --accent:#ffb3c9; --accent-soft:#ffe3ec;
    --bg:#fff6f9; --card:#ffffff; --muted:#a0718a; --line:#f6d9e3;
    --green:#2e9e5b; --greenbg:#e8f9ef; --amber:#b07d1e; --amberbg:#fff3d9;
    --red:#c0392b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,#ffeef4 0%,#fff6f9 260px,#fff6f9 100%);color:#5c2a42;-webkit-text-size-adjust:100;min-height:100vh}
  .topbar{background:linear-gradient(135deg,#ff7ba9,#e75480 60%,#d1466f);color:#fff;padding:16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;box-shadow:0 2px 14px rgba(231,84,128,.35);}
  .topbar .logo{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15);overflow:hidden;flex-shrink:0}
  .topbar .logo img{width:100%;height:100%;object-fit:cover;display:block}
  .topbar h1{font-size:19px;font-weight:800;letter-spacing:-.2px}
  .topbar .sub{font-size:12.5px;opacity:.92;font-weight:600}
  .wrap{max-width:680px;margin:0 auto;padding:16px 12px 60px}
  .searchbar{background:var(--card);border-radius:22px;box-shadow:0 4px 18px rgba(231,84,128,.12);padding:16px;margin-bottom:14px;border:1.5px solid #ffe3ec}
  .formtitle{margin-bottom:12px}
  .formtitle b{font-size:17px;display:block;color:var(--brand-deep)}
  .formtitle span{font-size:13px;color:var(--muted);font-weight:600}
  .frow{display:flex;gap:8px;margin-bottom:10px}
  .frow label{flex:1;font-size:11.5px;color:var(--muted);font-weight:700;display:block;min-width:0}
  .frow input,.frow select{width:100%;max-width:100%;min-width:0;margin-top:5px;font-size:16px;font-family:inherit;font-weight:600;padding:11px;border-radius:14px;border:2px solid var(--line);background:#fffafc;color:#5c2a42}
  .frow input:disabled{opacity:.35;background:#f6f0f3}
  .triptype{display:flex;background:#fbe4ee;border-radius:999px;padding:4px;margin-bottom:10px;gap:4px}
  .ttbtn{flex:1;border:0;background:transparent;border-radius:999px;padding:10px;font-family:inherit;font-size:14px;font-weight:800;color:var(--brand-deep);cursor:pointer;min-height:44px}
  .ttbtn.on{background:linear-gradient(135deg,#ff7ba9,#e75480);color:#fff;box-shadow:0 2px 8px rgba(231,84,128,.3)}
  .acwrap{position:relative;display:block}
  .acdrop{position:absolute;top:100%;left:0;right:0;z-index:60;background:#fff;border:2px solid var(--pink);border-radius:14px;margin-top:4px;box-shadow:0 8px 24px rgba(214,51,108,.18);overflow:hidden;max-height:300px;overflow-y:auto}
  .acitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid #fbe4ee;padding:10px 12px;font-family:inherit;cursor:pointer;min-height:52px}
  .acitem:last-child{border-bottom:0}
  .acitem.active,.acitem:active{background:#fdeef4}
  .acitem .ac-code{flex:0 0 auto;font-weight:800;font-size:13px;color:#fff;background:var(--pink);border-radius:8px;padding:4px 8px;letter-spacing:.5px}
  .acitem .ac-main{flex:1;min-width:0}
  .acitem .ac-city{display:block;font-weight:800;font-size:14.5px;color:#5c2a42;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acitem .ac-sub{display:block;font-weight:600;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* iOS gives native date pickers an unshrinkable minimum width that overlaps
     its neighbor in a flex row; opt out of the native control rendering so it
     respects the layout width (the picker still opens on tap) */
  @supports (-webkit-touch-callout:none){
    .frow input[type="date"]{-webkit-appearance:none;appearance:none}
  }
  .frow input:focus,.frow select:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px #ffe3ec}
  .cta{margin-top:8px;width:100%;background:linear-gradient(135deg,#ff7ba9,#e75480);color:#fff;border:none;border-radius:999px;padding:14px;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;display:block;text-align:center;text-decoration:none;box-shadow:0 4px 14px rgba(231,84,128,.4)}
  .cta:active{transform:scale(.98)}
  .cta:disabled{opacity:.6;cursor:default}
  .formstatus{display:none;margin-top:10px;font-size:13.5px;font-weight:600;border-radius:14px;padding:10px 12px;line-height:1.5}
  .formstatus.ok{display:block;background:var(--greenbg);color:var(--green)}
  .formstatus.err{display:block;background:#fdecea;color:#9c2b2b}
  .finder{display:none;background:var(--card);border-radius:22px;box-shadow:0 4px 18px rgba(231,84,128,.12);padding:16px;margin-bottom:14px;border:1.5px solid #ffe3ec}
  .finder.show{display:block}
  .finder h2{font-size:17px;margin-bottom:2px;color:var(--brand-deep)}
  .finder .fnote{font-size:12.5px;color:var(--muted);margin-bottom:10px;font-weight:600}
  #safetyPanel{margin:0 0 12px;border-radius:16px;padding:12px 14px;font-size:13.5px;line-height:1.5;background:#fff;border:2px solid #f3c6d8;box-shadow:0 2px 10px rgba(214,51,108,.08)}
  #safetyPanel.sp-ok{border-color:#bfe6c8;background:#f4fbf5}
  #safetyPanel.sp-warn{border-color:#f5d48a;background:#fffaf0}
  #safetyPanel.sp-danger{border-color:#f0a3a3;background:#fff5f5}
  #safetyPanel .sp-title{font-weight:800;font-size:14.5px;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  #safetyPanel .sp-score{display:inline-block;font-weight:800;font-size:12px;padding:2px 10px;border-radius:999px;background:#eee}
  #safetyPanel .sp-score.s-ok{background:#cdeccd;color:#1d6b2f}
  #safetyPanel .sp-score.s-warn{background:#fbe3a7;color:#8a5a00}
  #safetyPanel .sp-score.s-danger{background:#f6c1c1;color:#a02020}
  #safetyPanel .sp-scale{margin:8px 0 4px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.05)}
  #safetyPanel .sp-scale-label{font-weight:800;font-size:13.5px;margin-bottom:6px}
  #safetyPanel .sp-faces{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
  #safetyPanel .sp-face{font-size:22px;line-height:1.25}
  #safetyPanel .sp-face.off{filter:grayscale(1);opacity:.22}
  #safetyPanel .sp-scale-num{font-size:12.5px;color:var(--muted,#777)}
  #safetyPanel .sp-row{margin:7px 0;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.05)}
  #safetyPanel .sp-row .sp-tag{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:1px 8px;border-radius:999px;margin-right:6px;vertical-align:1px}
  #safetyPanel .sp-tag.t-ok{background:#cdeccd;color:#1d6b2f}
  #safetyPanel .sp-tag.t-warn{background:#fbe3a7;color:#8a5a00}
  #safetyPanel .sp-tag.t-danger{background:#f6c1c1;color:#a02020}
  #safetyPanel .sp-row a{color:var(--pink);font-weight:700}
  #safetyPanel .sp-src{font-size:11.5px;color:var(--muted);margin-top:8px}
  .floading{text-align:center;padding:22px;color:var(--muted);font-size:14px;font-weight:600}
  .floading .spin{display:inline-block;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 0.9s linear infinite;vertical-align:-5px;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .ocard{border:2px solid var(--line);border-radius:18px;padding:13px;margin-bottom:10px;display:flex;gap:12px;background:#fffdfd}
  .opricebox{text-align:right;flex-shrink:0;min-width:92px;display:flex;flex-direction:column;align-items:flex-end}
  .oprice{font-size:23px;font-weight:800;color:var(--brand-dark)}
  .oper{font-size:11px;color:var(--muted);font-weight:600}
  .oinfo{flex:1;min-width:0}
  .oair{font-size:15px;font-weight:800;color:var(--brand-deep)}
  .ometa{font-size:12.5px;color:var(--muted);margin:2px 0 6px;font-weight:600}
  .oseg{font-size:12.5px;color:var(--muted);line-height:1.6;font-weight:600}
  .oseg b{color:#5c2a42}
  .watchbtn{margin-top:8px;border:2px solid var(--brand);background:#fff;color:var(--brand);border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 2px 8px rgba(231,84,128,.18)}
  .watchbtn:active{transform:scale(.96)}
  .watchbtn:disabled{opacity:.6;cursor:default}
  .watchbtn.watching{border-color:var(--brand);color:#fff;background:linear-gradient(135deg,#ff7ba9,#e75480)}
  .bookbtn{display:inline-block;margin-top:8px;margin-left:6px;background:linear-gradient(135deg,#ff7ba9,#e75480);color:#fff;border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:800;text-decoration:none;box-shadow:0 2px 8px rgba(231,84,128,.25)}
  .bookbtn:active{transform:scale(.96)}
  .dealbadge{margin-top:6px;font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 10px;display:inline-block}
  .dealbadge.good{background:#cdeccd;color:#1d6b2f}
  .dealbadge.mid{background:#eee;color:#666}
  .dealbadge.high{background:#fbe3a7;color:#8a5a00}
  .flexbtn{margin-top:10px;width:100%;background:#fff;border:2px dashed var(--pink);color:var(--brand-deep);border-radius:999px;padding:11px;font-size:13.5px;font-weight:800;font-family:inherit;cursor:pointer;min-height:44px}
  .flexbtn:disabled{opacity:.6}
  .surprisebtn{margin-top:10px;width:100%;background:linear-gradient(135deg,#ff7ba9,#e75480);color:#fff;border:none;border-radius:999px;padding:12px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;min-height:44px;box-shadow:0 3px 12px rgba(231,84,128,.35)}
  .surprisebtn:active{transform:scale(.98)}
  .sparkwrap{margin-top:8px}
  .spark{display:block}
  .sparkcap{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:2px}
  #installHint{display:none;margin:0 0 12px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:700;color:var(--brand-deep);box-shadow:0 2px 10px rgba(231,84,128,.10)}
  #installHint button{float:right;background:none;border:none;font-size:16px;cursor:pointer;color:var(--muted);line-height:1}
  .flexchips{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:4px}
  .fchip{flex:0 0 auto;border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;font-family:inherit;cursor:pointer;text-align:center;min-width:78px;min-height:56px}
  .fchip .fd{display:block;font-size:12px;font-weight:800;color:var(--brand-deep)}
  .fchip .fp{display:block;font-size:14.5px;font-weight:800;color:var(--brand);margin-top:2px}
  .fchip.cheap{border-color:#4caf7d;background:#f4fbf5}
  .fchip.sel{border-color:var(--pink);background:#fdeef4}
  .fchip:disabled{opacity:.45;cursor:default}
  .siterow{margin-top:12px}
  .siterow .sitetitle{font-size:13.5px;font-weight:800;margin-bottom:8px;color:var(--brand-deep)}
  .sitebtns{display:flex;gap:8px;flex-wrap:wrap}
  .sitebtn{flex:1;min-width:120px;background:#fffafc;border:2px solid var(--line);color:var(--brand-dark);border-radius:999px;padding:10px;font-size:13.5px;font-weight:800;text-align:center;text-decoration:none}
  .sitebtn:active{background:#ffeef4}
  .tracktrip{margin-top:12px;width:100%;background:linear-gradient(135deg,#ffc2d6,#ff9ebb);color:var(--brand-deep);border:none;border-radius:999px;padding:13px;font-size:14.5px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 4px 12px rgba(231,84,128,.25)}
  .tracktrip:active{transform:scale(.98)}
  .tracktrip:disabled{opacity:.6;cursor:default}
  .ftracked{margin-top:10px;font-size:13px;font-weight:700;color:var(--green);background:var(--greenbg);border-radius:14px;padding:10px 12px}
  .emailrow{display:none;margin-top:10px;background:#fffafc;border:2px dashed var(--accent);border-radius:16px;padding:12px}
  .emailrow.show{display:block}
  .emailrow p{font-size:13.5px;margin-bottom:8px;font-weight:700;color:var(--brand-deep)}
  .emailrow .erow{display:flex;gap:8px}
  .emailrow input{flex:1;font-size:16px;font-family:inherit;font-weight:600;padding:11px;border-radius:14px;border:2px solid var(--line);color:#5c2a42}
  .emailrow button{background:linear-gradient(135deg,#ff7ba9,#e75480);color:#fff;border:none;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer}
  .sechead{font-size:16px;font-weight:800;margin:8px 2px 10px;color:var(--brand-deep)}
  .tracked{background:var(--card);border-radius:22px;box-shadow:0 4px 18px rgba(231,84,128,.12);padding:16px;margin-bottom:14px;border:1.5px solid #ffe3ec}
  .tracked .temail{font-size:12.5px;color:var(--muted);margin-bottom:10px;font-weight:600}
  .wcard{border:2px solid var(--line);border-radius:18px;padding:13px;margin-bottom:10px;background:#fffdfd}
  .wcard .wtop{display:flex;gap:10px;align-items:flex-start}
  .wcard .winfo{flex:1;min-width:0}
  .wcard .wroute{font-size:15px;font-weight:800;color:var(--brand-deep)}
  .wcard .wmeta{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.55;font-weight:600}
  .wcard .wprice{font-size:20px;font-weight:800;color:var(--brand-dark);text-align:right;flex-shrink:0}
  .wcard .wlbl{font-size:10.5px;color:var(--muted);text-align:right;font-weight:600}
  .wremove{margin-top:8px;background:none;border:2px solid var(--line);color:var(--red);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:800;font-family:inherit;cursor:pointer}
  .wremove:active{background:#fdecea}
  .tempty{text-align:center;color:var(--muted);font-size:14px;font-weight:600;padding:20px 10px;line-height:1.7}
  .tsec{font-size:12.5px;font-weight:800;color:var(--brand);margin:12px 0 8px;text-transform:uppercase;letter-spacing:.6px}
  .error{background:#fdecea;color:#9c2b2b;border-radius:16px;padding:16px;font-size:14px;font-weight:600;line-height:1.5}
  footer{text-align:center;font-size:12.5px;color:var(--muted);font-weight:600;padding:6px 20px 30px;line-height:1.7}

  /* celebration animations */
  #pupCard{position:fixed;right:0;top:36%;z-index:60;pointer-events:none;transform:translateX(120%);opacity:0}
  #pupCard.show{animation:pupIn 2.6s ease forwards}
  #pupCard .bubble{background:#fff;border:3px solid var(--brand);border-radius:20px;border-top-right-radius:6px;
    padding:10px 16px 10px 12px;font-weight:800;color:var(--brand-deep);font-size:14.5px;
    box-shadow:0 8px 24px rgba(231,84,128,.35);display:flex;align-items:center;gap:10px;margin-right:-3px;white-space:nowrap}
  #pupCard .pup{font-size:36px;line-height:1}
  @keyframes pupIn{
    0%{transform:translateX(120%);opacity:0}
    12%{transform:translateX(0);opacity:1}
    20%{transform:translateX(0) rotate(-5deg)}
    28%{transform:translateX(0) rotate(5deg)}
    36%{transform:translateX(0) rotate(-3deg)}
    44%{transform:translateX(0) rotate(0)}
    80%{transform:translateX(0);opacity:1}
    100%{transform:translateX(120%);opacity:0}
  }
  #courier{position:fixed;left:0;bottom:14px;z-index:60;pointer-events:none;transform:translateX(-140px);opacity:0}
  #courier.run{animation:courierRun 9s linear forwards}
  #courier .cbubble{background:#fff;border:2.5px solid var(--brand);border-radius:14px;padding:6px 12px;
    font-size:12.5px;font-weight:800;color:var(--brand-deep);margin-bottom:6px;margin-left:20px;
    box-shadow:0 4px 12px rgba(231,84,128,.3);white-space:nowrap;display:inline-block}
  #courier .cdog{font-size:40px;line-height:1;white-space:nowrap}
  @keyframes courierRun{
    0%{transform:translateX(-140px) translateY(0);opacity:0}
    4%{opacity:1}
    20%{transform:translateX(20vw) translateY(-7px);opacity:1}
    40%{transform:translateX(40vw) translateY(0);opacity:1}
    60%{transform:translateX(60vw) translateY(-7px);opacity:1}
    80%{transform:translateX(80vw) translateY(0);opacity:1}
    96%{opacity:1}
    100%{transform:translateX(112vw) translateY(0);opacity:0}
  }

  /* compliment chatbot */
  .chatfab{position:fixed;right:16px;bottom:16px;z-index:70;width:58px;height:58px;border-radius:50%;
    background:linear-gradient(135deg,#ff7ba9,#e75480);border:none;font-size:26px;cursor:pointer;
    box-shadow:0 6px 18px rgba(231,84,128,.5);display:flex;align-items:center;justify-content:center}
  .chatfab::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--brand);
    opacity:.6;animation:fabPulse 2.4s ease-out infinite}
  @keyframes fabPulse{0%{transform:scale(.85);opacity:.7}70%{transform:scale(1.15);opacity:0}100%{transform:scale(1.15);opacity:0}}
  .chatpanel{position:fixed;right:12px;bottom:86px;z-index:70;width:min(360px,calc(100vw - 24px));max-height:min(660px,calc(100vh - 110px));display:flex;flex-direction:column;
    background:#fff;border:3px solid var(--brand);border-radius:22px;box-shadow:0 12px 32px rgba(231,84,128,.35);overflow:hidden;
    display:none;flex-direction:column;overflow:hidden}
  .chatpanel.open{display:flex;animation:chatUp .25s ease}
  @keyframes chatUp{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
  .chathead{background:linear-gradient(135deg,#ff7ba9,#e75480);color:#fff;padding:12px 14px;
    font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:8px}
  .chathead .x{margin-left:auto;background:none;border:none;color:#fff;font-size:20px;cursor:pointer;font-weight:800;line-height:1}
  .chatphoto{background:#ffeef4;flex-shrink:0}
  .chatphoto img{display:block;width:100%;height:250px;object-fit:cover;object-position:center 22%}
  .chatbody{padding:12px;display:flex;flex-direction:column;gap:8px;max-height:190px;overflow-y:auto;background:#fff7fa;flex-shrink:1;min-height:80px}
  .chatmsg{max-width:88%;padding:9px 12px;border-radius:16px;font-size:13.5px;font-weight:600;line-height:1.45}
  .chatmsg.bot{background:#fff;border:2px solid var(--line);color:#5c2a42;border-bottom-left-radius:6px;align-self:flex-start}
  .chatmsg.me{background:linear-gradient(135deg,#ff7ba9,#e75480);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
  .chatmsg.typing{opacity:.65}
  .chatinput{display:flex;gap:8px;padding:10px;border-top:2px solid var(--line);background:#fff}
  .chatinput input{flex:1;border:2px solid var(--line);border-radius:999px;padding:10px 14px;
    font-size:16px;font-family:inherit;font-weight:600;color:#5c2a42;min-width:0}
  .chatinput input:focus{outline:none;border-color:var(--brand)}
  .chatinput button{background:linear-gradient(135deg,#ff7ba9,#e75480);color:#fff;border:none;border-radius:50%;
    width:42px;height:42px;font-size:17px;cursor:pointer;flex-shrink:0}

  .chatfoot{background:#ffeef4;border-top:2px dashed var(--accent);padding:9px 12px;
    font-size:11.5px;font-weight:700;color:var(--brand-deep);text-align:center;line-height:1.5}

body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fff5f7;margin:0;padding:16px;color:#333}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:20px;color:#d6336c}
.note{background:#fff;border:2px solid #f3c6d8;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.btns button{background:#d6336c;color:#fff;border:none;border-radius:999px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer}
.btns button:active{transform:scale(.96)}
.row{display:flex;gap:8px;margin-bottom:12px}
.row input{flex:1;border:2px solid #f3c6d8;border-radius:12px;padding:10px 12px;font-size:14px;text-transform:uppercase}
.row button{background:#fff;color:#d6336c;border:2px solid #d6336c;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer}
#status{font-size:13px;color:#888;margin-bottom:8px;min-height:18px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🌞 Sunny's safety scale — test page</h1>
  <div class="note">This page calls <b>only</b> the safety-check backend — <b>0 flight-search tokens used</b>, no matter how many times you tap. Pick a destination to see its real safety scale.</div>
  <div class="btns">
    <button data-dest="MBJ">🇯🇲 Jamaica</button>
    <button data-dest="NRT">🇯🇵 Japan</button>
    <button data-dest="LGW">🇬🇧 London</button>
    <button data-dest="SIN">🇸🇬 Singapore</button>
    <button data-dest="ZRH">🇨🇭 Zurich</button>
    <button data-dest="CUN">🇲🇽 Cancun</button>
  </div>
  <div class="row">
    <input id="dest" maxlength="3" placeholder="IATA code (e.g. CDG)">
    <button id="go">Check</button>
  </div>
  <div id="status"></div>
  <div id="safetyPanel" style="display:none"></div>
</div>
<script>
var FINDER_URL = "https://script.google.com/macros/s/AKfycbz_cVk4DtWpmjQ4NLVfDb1NcZTmchrt7nVzRWn4aqj2MvPOXjxTsB9Z98jURwE8SR0l/exec";
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function api(params, cb){
  var cbName = "ftApi" + Date.now() + Math.floor(Math.random()*1000);
  var s = document.createElement("script");
  var done = false;
  function cleanup(){
    if(done) return; done = true;
    clearTimeout(timer);
    try{ delete window[cbName]; }catch(e){ window[cbName] = undefined; }
    if(s.parentNode) s.parentNode.removeChild(s);
  }
  window[cbName] = function(data){ cleanup(); cb(data); };
  var q = "callback=" + encodeURIComponent(cbName);
  for(var k in params){ q += "&" + encodeURIComponent(k) + "=" + encodeURIComponent(params[k]); }
  var timer = setTimeout(function(){ cleanup(); cb({ok:false, error:"timeout"}); }, 30000);
  s.onerror = function(){ cleanup(); cb({ok:false, error:"network"}); };
  s.src = FINDER_URL + "?" + q;
  document.head.appendChild(s);
}
function renderSafety(panel, data, destName){
  if(!data || !data.ok || !data.iso3){
    panel.style.display = "none";
    return;
  }
  var sev = 0; // 0 ok, 1 warn, 2 danger
  var rows = [];
  function tag(level){ return level >= 4 ? ['t-danger','Do not travel'] : level === 3 ? ['t-warn','Reconsider'] : level === 2 ? ['t-warn','Caution'] : ['t-ok','Normal']; }

  // government advisories
  var adv = data.advisories || {};
  ['us','ca'].forEach(function(k){
    var a = adv[k];
    if(!a || !a.level) return;
    var t = tag(a.level);
    if(a.level >= 3) sev = Math.max(sev, 2); else if(a.level === 2) sev = Math.max(sev, 1);
    var label = k === 'us' ? '🇺🇸 US advisory' : '🇨🇦 Canada advisory';
    rows.push('<div class="sp-row"><span class="sp-tag ' + t[0] + '">Level ' + a.level + '</span><b>' + label + ':</b> ' + esc(a.text) +
      (a.url ? ' <a href="' + esc(a.url) + '" target="_blank" rel="noopener">details</a>' : '') + '</div>');
  });

  // seasonal weather risks
  (data.seasonal || []).forEach(function(r){
    if(r.severity === 'high') sev = Math.max(sev, 2); else sev = Math.max(sev, 1);
    var icon = /hurricane|typhoon|cyclone/i.test(r.title) ? '🌀' : /heat|wildfire/i.test(r.title) ? '🔥' : /snow|winter|blizzard|ice/i.test(r.title) ? '❄️' : /rain|monsoon|flood|storm/i.test(r.title) ? '🌧️' : /earthquake|volcano|tsunami/i.test(r.title) ? '🌋' : '⚠️';
    rows.push('<div class="sp-row"><span class="sp-tag ' + (r.severity === 'high' ? 't-danger' : 't-warn') + '">Seasonal</span>' + icon + ' <b>' + esc(r.title) + ':</b> ' + esc(r.detail) + '</div>');
  });

  // active natural disasters
  (data.disasters || []).forEach(function(d){
    sev = Math.max(sev, 2);
    rows.push('<div class="sp-row"><span class="sp-tag t-danger">Live</span>🌋 <b>' + esc(d.title) + '</b>' +
      (d.link ? ' <a href="' + esc(d.link) + '" target="_blank" rel="noopener">details</a>' : '') + '</div>');
  });

  var cls = sev === 2 ? 'sp-danger' : sev === 1 ? 'sp-warn' : 'sp-ok';
  var scaleHtml = '';
  if (data.safety && data.safety.score != null) {
    var sc = Math.max(0, Math.min(10, Math.round(Number(data.safety.score))));
    var faces = '';
    for (var fi = 0; fi < 10; fi++) {
      faces += '<span class="sp-face' + (fi < sc ? '' : ' off') + '">🌞</span>';
    }
    var unit = sc === 1 ? 'happy sunny' : 'happy sunnys';
    scaleHtml = '<div class="sp-scale"><div class="sp-scale-label">Sunny\'s safety scale</div>' +
      '<div class="sp-faces">' + faces + '</div>' +
      '<div class="sp-scale-num"><b>' + sc + '</b> ' + unit + ' / 10</div></div>';
  }
  var head = sev === 0
    ? 'All clear! Sniffed around and found nothing scary for your dates 🐾'
    : sev === 1
    ? 'A few things to sniff at before you book 👀'
    : 'Heads up, babe — read this before you book 🚨';
  panel.className = cls;
  panel.innerHTML = '<div class="sp-title">🐶 Safety sniff-check: ' + esc(data.country || destName) + '</div>' +
    scaleHtml +
    '<div style="font-weight:700;margin-bottom:4px">' + head + '</div>' +
    rows.join('') +
    '<div class="sp-src">Advisories & safety scores: isitsafetotravel.org (daily) · Disasters: GDACS · Seasonal outlook: our own sniffing. Always double-check official sources before booking 💕</div>';
  panel.style.display = "block";
}

function check(dest){
  dest = (dest||'').trim().toUpperCase();
  if(!/^[A-Z]{3}$/.test(dest)){ document.getElementById('status').textContent = 'Enter a 3-letter airport code.'; return; }
  var panel = document.getElementById('safetyPanel');
  var status = document.getElementById('status');
  panel.style.display = 'block';
  panel.className = '';
  panel.innerHTML = '<div class="sp-title">🐶 Safety sniff-check <span style="font-weight:600;color:#888">sniffing ' + esc(dest) + '...</span></div>';
  status.textContent = 'Fetching (token-free)...';
  var dep = '2026-11-15', ret = '2026-11-22';
  api({action:'risks', dest:dest, departDate:dep, returnDate:ret}, function(data){
    status.textContent = '';
    renderSafety(panel, data, dest);
    if(panel.style.display === 'none'){ status.textContent = 'No safety data for ' + dest + '.'; }
  });
}
document.querySelectorAll('.btns button').forEach(function(b){
  b.addEventListener('click', function(){ check(b.getAttribute('data-dest')); });
});
document.getElementById('go').addEventListener('click', function(){
  check(document.getElementById('dest').value);
});
</script>
</body>
</html>
