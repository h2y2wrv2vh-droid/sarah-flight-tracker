<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Animation Test Lab 🐶</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#e75480; --brand-dark:#c2436c; --brand-deep:#8e2f52;
    --accent:#ffb3c9; --accent-soft:#ffe3ec;
    --bg:#fff6f9; --card:#ffffff; --muted:#a0718a; --line:#f6d9e3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg,#ffeef4 0%,#fff6f9 260px,#fff6f9 100%);color:#5c2a42;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .lab{background:var(--card);border-radius:22px;box-shadow:0 4px 18px rgba(231,84,128,.12);
    padding:28px 24px;border:1.5px solid #ffe3ec;max-width:420px;width:100%;text-align:center}
  .lab h1{font-size:20px;color:var(--brand-deep);margin-bottom:6px}
  .lab p{font-size:13.5px;color:var(--muted);font-weight:600;margin-bottom:20px;line-height:1.6}
  .tbtn{display:block;width:100%;margin-bottom:12px;border:none;border-radius:999px;padding:15px;
    font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;color:#fff;
    background:linear-gradient(135deg,#ff7ba9,#e75480);box-shadow:0 4px 14px rgba(231,84,128,.4)}
  .tbtn:active{transform:scale(.97)}
  .tbtn.alt{background:linear-gradient(135deg,#ffc2d6,#ff9ebb);color:var(--brand-deep);
    box-shadow:0 4px 12px rgba(231,84,128,.25)}
  .back{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--brand-dark);text-decoration:none}

  /* copied verbatim from the live site */
  #pupCard{position:fixed;right:0;top:36%;z-index:60;pointer-events:none;transform:translateX(120%);opacity:0}
  #pupCard.show{animation:pupIn 2.6s ease forwards}
  #pupCard .bubble{background:#fff;border:3px solid var(--brand);border-radius:20px;border-top-right-radius:6px;
    padding:10px 16px 10px 12px;font-weight:800;color:var(--brand-deep);font-size:14.5px;
    box-shadow:0 8px 24px rgba(231,84,128,.35);display:flex;align-items:center;gap:10px;margin-right:-3px;white-space:nowrap}
  #pupCard .pup{font-size:36px;line-height:1}
  @keyframes pupIn{
    0%{transform:translateX(120%);opacity:0}
    12%{transform:translateX(0);opacity:1}
    20%{transform:translateX(0) rotate(-5deg)}
    28%{transform:translateX(0) rotate(5deg)}
    36%{transform:translateX(0) rotate(-3deg)}
    44%{transform:translateX(0) rotate(0)}
    80%{transform:translateX(0);opacity:1}
    100%{transform:translateX(120%);opacity:0}
  }
  #courier{position:fixed;left:0;bottom:14px;z-index:60;pointer-events:none;transform:translateX(-140px)}
  #courier.run{animation:courierRun 9s linear forwards}
  #courier .cbubble{background:#fff;border:2.5px solid var(--brand);border-radius:14px;padding:6px 12px;
    font-size:12.5px;font-weight:800;color:var(--brand-deep);margin-bottom:6px;margin-left:20px;
    box-shadow:0 4px 12px rgba(231,84,128,.3);white-space:nowrap;display:inline-block}
  #courier .cdog{font-size:40px;line-height:1;white-space:nowrap}
  @keyframes courierRun{
    0%{transform:translateX(-140px) translateY(0)}
    20%{transform:translateX(20vw) translateY(-7px)}
    40%{transform:translateX(40vw) translateY(0)}
    60%{transform:translateX(60vw) translateY(-7px)}
    80%{transform:translateX(80vw) translateY(0)}
    100%{transform:translateX(112vw) translateY(0)}
  }
</style>
</head>
<body>
<div class="lab">
  <h1>🐶 Animation Test Lab</h1>
  <p>These trigger the exact same animations as the live site.<br>No email needed — just tap and watch.</p>
  <button class="tbtn" onclick="pupPop()">🐶👍 Pop-out puppy<br><small style="font-weight:600;font-size:12px">(+ Track on a flight)</small></button>
  <button class="tbtn alt" onclick="courierRun()">🐶🧳 Puppy courier<br><small style="font-weight:600;font-size:12px">(Track this trip)</small></button>
  <a class="back" href="/">← back to the tracker</a>
</div>

<div id="pupCard" aria-hidden="true"><div class="bubble"><span class="pup">🐶👍</span><span>Yay! Tracking this one! 🐾</span></div></div>
<div id="courier" aria-hidden="true"><div class="cbubble">Off to fetch your deal! 🐾</div><br><div class="cdog">🐶🧳</div></div>

<script>
function reduceMotion(){ return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
function pupPop(){
  if(reduceMotion()) return;
  var el = document.getElementById('pupCard');
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}
function courierRun(){
  if(reduceMotion()) return;
  var el = document.getElementById('courier');
  el.classList.remove('run'); void el.offsetWidth; el.classList.add('run');
}
</script>
</body>
</html>
